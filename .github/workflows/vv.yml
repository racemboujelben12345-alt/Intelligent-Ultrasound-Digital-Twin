name: Digital Twin V&V

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  v_and_v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run final engineering V&V audit
        env:
          PYTHONPATH: .
        run: python scripts/run_final_vv.py --n 10 --repeats 20 --seed 42
      - name: Upload V&V reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-vv-reports
          path: outputs/vv/
          if-no-files-found: warn
