name: Digital Twin V&V

on:
  push:
    branches: [main, refactor/ultrasound-digital-twin]
  pull_request:
    branches: [main]

jobs:
  v_and_v:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run source-aware V&V audit
        env:
          PYTHONPATH: .
        run: python scripts/run_vv_audit.py --n 10
